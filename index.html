<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src localvideo: https://*.googlevideo.com https://*.twitchcdn.net https://*.twitch.tv https://d1ndex63qxojbr.cloudfront.net; img-src 'self' data: localvideo: https://i.ytimg.com; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv">
  <title>Ozy Multi Media Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="menu" id="add-menu">
      <button id="btn-add" title="Add local files or a YouTube / Twitch URL">+ Add videos ▾</button>
      <div class="menu-list" hidden>
        <button id="add-local">Local files… <kbd>Ctrl+A</kbd></button>
        <button id="add-url">YouTube / Twitch URL…</button>
      </div>
    </div>
    <button id="btn-sidebar" title="Sources sidebar: folders and playlists to drag from (`)">☰ Sources</button>
    <button id="btn-open" title="Open a saved .mvp session (Ctrl+O)">Open session</button>
    <button id="btn-save" title="Save session (Ctrl+S). Right-click: Save as… (Ctrl+Shift+S)">Save</button>
    <!-- DISABLED (Mark, 2026-09-11): replaced by Clear board; Save right-click = Save as
    <button id="btn-save-as" title="Save session to a new file (Ctrl+Shift+S)">Save as…</button>
    -->
    <button id="btn-clear" title="Remove every video from the board (asks first)">Clear board</button>
    <div class="menu" id="app-menu">
      <button id="btn-app" title="Cache, updates and version">App ▾</button>
      <div class="menu-list" hidden>
        <button id="btn-cache" title="Playable copies, thumbnails and decoded sequence frames live in a cache folder">Cache…</button>
        <button id="btn-check-updates">Check for updates</button>
        <label class="menu-check"><input type="checkbox" id="upd-auto"> Check automatically on launch</label>
        <label class="menu-check"><input type="checkbox" id="upd-prerelease"> Include pre-releases</label>
        <button id="btn-version" disabled>Version …</button>
      </div>
    </div>
    <span class="sep"></span>
    <button id="btn-play-all" title="Play every video (Space)">Play all</button>
    <button id="btn-pause-all" title="Pause every video (Space)">Pause all</button>
    <!-- DISABLED (Mark, 2026-09-11): Mute all + Unmute all merged into one toggle; Loop all took the freed slot
    <button id="btn-mute-all" title="Mute every video">Mute all</button>
    <button id="btn-unmute-all" title="Unmute every video">Unmute all</button>
    -->
    <button id="btn-mute-all" title="Mute every video, or unmute them all when every one is muted">🔇 Mute all</button>
    <button id="btn-loop-all" title="Loop every video; click again to turn every loop off">🔁 Loop all</button>
    <span class="sep"></span>
    <div class="seg" id="mode">
      <button data-mode="gallery" class="active" title="Attached: videos flow in rows and share one size. Pull any corner to resize them all.">Gallery</button>
      <button data-mode="board" title="Detached: an infinite board. Drag videos anywhere, resize each one on its own, pan and zoom the view.">Board</button>
    </div>
    <label class="zoom" title="Gallery: scale every video together (keeps their relative sizes). Board: view zoom. Ctrl + mouse wheel over the videos does the same.">
      <span>🔍</span>
      <input type="range" id="zoom" min="0" max="1000" value="500">
      <span id="zoom-label"></span>
    </label>
    <button id="btn-fit" title="Fit every video on screen">Fit all</button>
    <button id="btn-group" title="Group the selected videos (Ctrl+G)">Group</button>
    <button id="btn-ungroup" title="Ungroup (Ctrl+Shift+G)">Ungroup</button>
    <button id="btn-ab" title="A/B: compare two selected videos with a wipe or flip (C)">A/B</button>
    <!-- DISABLED (Mark, 2026-09-11): old Tidy wrapped at the tiles' own width and collapsed into 2 columns; replaced by the Tidy menu
    <button id="btn-tidy" class="board-only" title="Line the videos up in neat rows, keeping their sizes">Tidy</button>
    -->
    <div class="menu board-only" id="tidy-menu">
      <button id="btn-tidy-menu" title="Arrange the board">Tidy ▾</button>
      <div class="menu-list" hidden>
        <button id="tidy-fit" title="Every tile the same height, as big as fits in the current view (Ctrl+Z undoes)">Fit to view <small>same size, fills the view</small></button>
        <button id="tidy-grid" title="Keep sizes and pack edge to edge into a rough square (Ctrl+Z undoes). Linked spaces them out again on the next drag.">Grid <small>keep sizes, no gaps</small></button>
      </div>
    </div>
    <button id="btn-link" class="board-only" title="Linked: when you move or resize a video, its neighbours slide out of the way so nothing overlaps (Shift+L). Off: videos can overlap freely.">🔗 Linked</button>
    <button id="btn-hand" class="board-only" title="Pan + zoom: left-drag pans, wheel zooms (H). Middle-mouse or Alt-drag always pans.">✋ Pan + zoom</button>
    <span id="count"></span>
    <span class="sep"></span>
    <label class="master" title="Master volume – scales every video's own volume">
      <span id="master-icon">🔊</span>
      <input type="range" id="master-vol" min="0" max="100" value="100">
      <span id="master-pct">100%</span>
    </label>
    <span id="status"></span>
    <div id="url-bar" hidden>
      <input type="url" id="url-input" placeholder="Paste a YouTube video, Short, playlist, Twitch clip or channel URL" spellcheck="false">
      <button id="url-go">Add</button>
      <button id="url-cancel" title="Close (Esc)">✕</button>
    </div>
  </header>

  <div id="workspace">
    <aside id="sidebar" hidden>
      <div class="sb-head">
        <span>Sources</span>
        <button id="sb-add-selected" title="Add every highlighted row to the board (Enter)" disabled>Add selected</button>
        <button id="sb-add-folder" class="tab-local" title="Add a folder">+ Folder</button>
        <button id="sb-add-playlist" class="tab-web" title="Add a YouTube playlist" disabled>+ Playlist</button>
      </div>
      <div class="sb-tabs"><button data-tab="local" class="active">Local</button><button data-tab="web">YouTube / Twitch</button></div>
      <div class="sb-section tab-local" data-section="folders"><div class="sb-title">Folders</div><div class="sb-list"></div></div>
      <div class="sb-section tab-web" data-section="playlists"><div class="sb-title">Playlists</div><div class="sb-list"></div><div class="sb-note"></div></div>
      <div id="sb-resize"></div>
    </aside>
    <main id="grid">
      <div id="canvas"></div>
      <div id="marquee" hidden></div>
      <div id="guide-v" class="guide" hidden></div>
      <div id="guide-h" class="guide" hidden></div>
    </main>
  </div>
  <template id="sb-source-template">
    <div class="sb-source">
      <div class="sb-row">
        <button class="sb-expand">▸</button>
        <span class="sb-name"></span>
        <span class="sb-count"></span>
        <button class="sb-addall" title="Add every video">Add all</button>
        <button class="sb-addall-img" title="Add every item including images">+ images</button>
        <button class="sb-menu" title="Refresh / Pin / Remove">⋯</button>
      </div>
      <div class="sb-actions" hidden>
        <button class="sb-refresh">Refresh</button>
        <button class="sb-pin">Pin</button>
        <button class="sb-remove">Remove</button>
      </div>
      <div class="sb-items" hidden></div>
    </div>
  </template>
  <template id="sb-item-template">
    <div class="sb-item" draggable="true">
      <img class="sb-thumb" alt="">
      <span class="sb-item-name"></span>
      <span class="sb-dur"></span>
      <span class="sb-onboard" title="Already on the board">●</span>
    </div>
  </template>

  <div id="groupbar" hidden>
    <span class="gb-swatch" title="Click to change the group colour"></span>
    <input class="gb-name" type="text" spellcheck="false" title="Group name">
    <button class="gb-play" title="Play / pause the group">▶</button>
    <button class="gb-mute" title="Mute / unmute the group">🔊</button>
    <label title="Group volume"><input type="range" class="gb-vol" min="0" max="100" value="100"></label>
    <select class="gb-rate" title="Group speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
      <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
    <span class="sep"></span>
    <button class="gb-sync" title="Sync: members share one timeline and play, pause, scrub and step together">⛓ Sync</button>
    <button class="gb-sticky board-only" title="Sticky: dragging one member moves the whole group (Ctrl-drag moves one)">📌 Sticky</button>
    <label class="gb-loop-wrap" title="Loop mode for this group">Loop
      <select class="gb-loop">
        <option value="off">Off</option>
        <option value="shortest">When shortest ends</option>
        <option value="longest">When longest ends</option>
        <option value="range">Timeline range</option>
      </select>
    </label>
    <span class="gb-note"></span>
    <span class="spacer"></span>
    <button class="gb-ungroup" title="Ungroup (Ctrl+Shift+G)">Ungroup</button>
  </div>

  <div id="timeline" hidden>
    <div class="tl-head">
      <button class="tl-grip" title="Expand / collapse (T). Drag the bar up or down to resize.">▴</button>
      <span class="tl-title"></span>
      <span class="tl-time"></span>
      <span class="tl-legend"></span>
      <span class="spacer"></span>
      <button class="tl-set-in" title="Set loop In at the playhead (I)">In</button>
      <button class="tl-set-out" title="Set loop Out at the playhead (O)">Out</button>
      <button class="tl-clear-range" title="Clear the loop range">Clear</button>
    </div>
    <div class="tl-body">
      <div class="tl-lanes"></div>
      <div class="tl-bar">
        <div class="tl-range"></div>
        <div class="tl-markers"></div>
        <div class="tl-handle tl-in" title="Loop In"></div>
        <div class="tl-handle tl-out" title="Loop Out"></div>
        <div class="tl-playhead"></div>
      </div>
    </div>
  </div>

  <div id="empty">
    <div class="big">Drop video files here</div>
    <div>or click <b>+ Add videos</b>. Drop a <b>.mvp</b> file to restore a saved session.</div>
    <div class="hint">Gallery keeps videos attached in rows. Board is an infinite canvas: drag videos anywhere, resize each one, lasso several to move them together, pan and zoom.</div>
  </div>

  <div id="drop-hint">Release to add</div>

  <div id="compare" hidden>
    <div class="cmp-stage">
      <div class="cmp-slot cmp-a"></div>
      <div class="cmp-slot cmp-b"></div>
      <div class="cmp-wipe" title="Drag to move the wipe"></div>
      <div class="cmp-label cmp-label-a"></div>
      <div class="cmp-label cmp-label-b"></div>
    </div>
    <div class="cmp-bar">
      <button class="cmp-play" title="Play / pause both (Space)">▶</button>
      <button class="cmp-fb" title="Back one frame (,)">|◀</button>
      <button class="cmp-ff" title="Forward one frame (.)">▶|</button>
      <input type="range" class="cmp-seek" min="0" max="10000" value="0">
      <span class="cmp-time"></span>
      <div class="seg cmp-mode">
        <button data-cmp="wipe" class="active">Wipe</button>
        <button data-cmp="flip">Flip (Tab)</button>
      </div>
      <button class="cmp-close">Close (Esc)</button>
    </div>
  </div>

  <!-- update banner: sits above the tiles, never blocks anything -->
  <div id="update-banner" hidden>
    <span class="ub-text"></span>
    <span class="ub-progress" hidden><span class="ub-fill"></span></span>
    <button class="ub-action"></button>
    <button class="ub-dismiss" title="Hide until next launch">✕</button>
  </div>

  <template id="tile-template">
    <div class="tile">
      <video preload="metadata" draggable="false"></video>
      <div class="overlay">
        <div class="top">
          <button class="remove" title="Remove this video">✕</button>
          <span class="group-swatch" hidden></span>
          <span class="name"></span>
          <button class="fullscreen" title="Fullscreen (double-click the picture also works; Esc leaves)">⛶</button>
        </div>
        <div class="vol-zone" title="Volume: click or drag anywhere on the bar. Mouse wheel and ↑/↓ work too.">
          <div class="vol-bar">
            <div class="vol-fill"></div>
            <span class="vol-pct">10%</span>
          </div>
        </div>
        <div class="bottom">
          <div class="markers" title=""></div>
          <input type="range" class="seek" min="0" max="10000" value="0" step="1" title="Scrub">
          <div class="row">
            <button class="play" title="Play / pause (K)">▶</button>
            <button class="fstep-back" title="Back one frame (,)">|◀</button>
            <button class="back" title="Back 5 s (←). Shift for 30 s">−5s</button>
            <button class="fwd" title="Forward 5 s (→). Shift for 30 s">+5s</button>
            <button class="fstep-fwd" title="Forward one frame (.)">▶|</button>
            <span class="time" title="Click to switch clock / frames / timecode">0:00 / 0:00</span>
            <span class="spacer"></span>
            <button class="bm-add" title="Add a bookmark at the current time (B)">🔖+</button>
            <button class="bm-list" title="Bookmarks: click to list, rename, or delete. [ and ] jump between them.">🔖<span class="bm-count">0</span></button>
            <button class="mute" title="Mute / unmute (M)">🔊</button>
            <button class="loop" title="Loop this video (L)">🔁</button>
            <select class="rate" title="Playback speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
            <button class="settings" title="Settings: frame rate override for frame step and timecode">⚙</button>
          </div>
          <div class="bm-panel hidden"></div>
        </div>
      </div>
      <div class="error hidden">
        <div class="error-text"></div>
        <div class="error-actions">
          <button class="make-proxy">Make playable</button>
          <button class="cancel-proxy hidden">Cancel</button>
        </div>
        <div class="proxy-bar hidden"><div class="proxy-fill"></div></div>
      </div>
      <div class="handle tl" data-corner="tl"></div>
      <div class="handle tr" data-corner="tr"></div>
      <div class="handle bl" data-corner="bl"></div>
      <div class="handle br" data-corner="br"></div>
    </div>
  </template>

  <!-- image sequence: a frame player drawing into a canvas (no audio, so no mute or volume) -->
  <template id="seq-tile-template">
    <div class="tile sequence">
      <canvas></canvas>
      <div class="seq-badge" hidden></div>
      <div class="overlay">
        <div class="top">
          <button class="remove" title="Remove this sequence">✕</button>
          <span class="group-swatch" hidden></span>
          <span class="name"></span>
          <button class="fullscreen" title="Fullscreen (double-click the picture also works; Esc leaves)">⛶</button>
        </div>
        <div class="bottom">
          <div class="markers" title=""></div>
          <div class="cache-bar" title="Frames ready to show: dim = decoded on disk, bright = in memory"></div>
          <input type="range" class="seek" min="0" max="10000" value="0" step="1" title="Scrub">
          <div class="row">
            <button class="play" title="Play / pause (K)">▶</button>
            <button class="fstep-back" title="Back one frame (,)">|◀</button>
            <button class="back" title="Back 5 s (←). Shift for 30 s">−5s</button>
            <button class="fwd" title="Forward 5 s (→). Shift for 30 s">+5s</button>
            <button class="fstep-fwd" title="Forward one frame (.)">▶|</button>
            <span class="time" title="Click to switch clock / frames / timecode">0:00 / 0:00</span>
            <span class="spacer"></span>
            <button class="bm-add" title="Add a bookmark at the current frame (B)">🔖+</button>
            <button class="bm-list" title="Bookmarks: click to list, rename, or delete. [ and ] jump between them.">🔖<span class="bm-count">0</span></button>
            <button class="loop" title="Loop this video (L)">🔁</button>
            <select class="rate" title="Playback speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
            <button class="settings" title="Settings: frame rate, and exposure / colour for EXR">⚙</button>
          </div>
          <div class="bm-panel hidden"></div>
        </div>
      </div>
      <div class="error hidden">
        <div class="error-text"></div>
        <div class="error-actions"><button class="retry">Re-decode</button></div>
      </div>
      <div class="handle tl" data-corner="tl"></div><div class="handle tr" data-corner="tr"></div>
      <div class="handle bl" data-corner="bl"></div><div class="handle br" data-corner="br"></div>
    </div>
  </template>

  <template id="image-tile-template">
    <div class="tile image">
      <img draggable="false" alt="">
      <div class="overlay">
        <div class="top"><button class="remove" title="Remove">✕</button><span class="group-swatch" hidden></span><span class="name"></span><button class="fullscreen" title="Fullscreen (double-click the picture also works; Esc leaves)">⛶</button></div>
      </div>
      <div class="handle tl" data-corner="tl"></div><div class="handle tr" data-corner="tr"></div>
      <div class="handle bl" data-corner="bl"></div><div class="handle br" data-corner="br"></div>
    </div>
  </template>

  <template id="web-tile-template">
    <div class="tile web">
      <!-- Stream / Download modes play a real <video>; Player mode shows the iframe instead -->
      <video preload="metadata" draggable="false" hidden></video>
      <iframe allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="pan-shield"></div>
      <div class="overlay">
        <div class="top"><button class="remove" title="Remove">✕</button><span class="group-swatch" hidden></span><span class="name"></span><select class="web-mode" title="How this video plays: a direct 720p stream, YouTube's own player (higher quality, needs a click), or a full-quality download kept in the cache"><option value="stream">Stream</option><option value="player">Player</option><option value="download">Local</option></select><button class="fullscreen" title="Fullscreen (Esc leaves)">⛶</button></div>
        <div class="bottom">
          <div class="markers"></div>
          <input type="range" class="seek" min="0" max="10000" value="0" step="1" title="Scrub">
          <div class="row">
            <button class="play" title="Play / pause (K)">▶</button>
            <span class="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <button class="bm-add" title="Add a bookmark at the current time (B)">🔖+</button>
            <button class="bm-list" title="Bookmarks: click to list, rename, or delete. [ and ] jump between them.">🔖<span class="bm-count">0</span></button>
            <button class="mute" title="Mute / unmute (M)">🔊</button>
            <button class="loop" title="Loop this video (L)">🔁</button>
          </div>
          <div class="bm-panel hidden"></div>
        </div>
      </div>
      <div class="error hidden">
        <div class="error-text"></div>
        <div class="error-actions">
          <button class="retry">Retry</button>
          <button class="make-proxy hidden">Download</button>
          <button class="use-player hidden">Player</button>
          <button class="cancel-proxy hidden">Cancel</button>
        </div>
        <div class="proxy-bar hidden"><div class="proxy-fill"></div></div>
      </div>
      <div class="handle tl" data-corner="tl"></div><div class="handle tr" data-corner="tr"></div>
      <div class="handle bl" data-corner="bl"></div><div class="handle br" data-corner="br"></div>
    </div>
  </template>

  <script src="lib/codecs.js"></script>
  <script src="lib/weburl.js"></script>
  <script src="lib/frames.js"></script>
  <script src="lib/groups.js"></script>
  <script src="lib/timeline.js"></script>
  <script src="lib/undo.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/sources.js"></script>
  <script src="lib/arrange.js"></script>
  <script src="lib/sequence.js"></script>
  <script src="lib/framecache.js"></script>
  <script src="lib/exrheader.js"></script>
  <script src="lib/webstream.js"></script>
  <script src="app.js"></script>
</body>
</html>
